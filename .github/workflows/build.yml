name: Build 5Mind Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install bsdtar (libarchive-tools) for Pacman
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools

      - name: Build application
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          case "${{ matrix.platform }}" in
            linux)
              npx electron-builder --linux appimage deb pacman rpm --x64
              ;;
            win)
              npx electron-builder --win --x64
              ;;
            mac)
              npx electron-builder --mac --x64 --arm64
              ;;
            *)
              echo "Unknown platform: ${{ matrix.platform }}"
              exit 1
              ;;
          esac

          echo "=== Built files in dist/ ==="
          ls -la dist/ || true

      - name: List built artifacts (debug)
        shell: bash
        run: |
          echo "Artifacts for ${{ matrix.platform }}:"
          ls -la dist/* || true

      - name: Upload artifacts (debug & backup)
        uses: actions/upload-artifact@v4
        with:
          name: 5mind-desktop-${{ matrix.platform }}
          path: dist/*
          retention-days: 7

      - name: Create GitHub Release & Upload Assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 5Mind Desktop ${{ github.ref_name }}
          body: |
            ### 5Mind Desktop ${{ github.ref_name }}

            Cross-platform release:
            - **Windows** — Installer (.exe)
            - **macOS** — DMG + ZIP (x64 & arm64)
            - **Linux** — AppImage, DEB, Pacman, RPM

            Auto-generated changelog below.
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
          files: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*.pacman
            dist/*.rpm
