name: Build 5Mind Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   

jobs:
  prepare-tag:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.set-tag.outputs.tag_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create and push version tag (manual dispatch only)
        id: set-tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="v0.0.${{ github.run_number }}"
            git config user.name "GitHub Actions"
            git config user.email "actions@github.com"
            git tag "$TAG"
            git push origin "$TAG"
            echo "Created and pushed tag: $TAG"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag_name=$TAG" >> $GITHUB_OUTPUT

  build:
    name: Build for ${{ matrix.platform }}
    needs: prepare-tag         
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install bsdtar (libarchive-tools) for Pacman
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools

      - name: Build application
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        shell: bash
        run: |
          case "${{ matrix.platform }}" in
            linux)
              npx electron-builder --linux appimage deb pacman rpm --x64
              ;;
            win)
              npx electron-builder --win --x64
              ;;
            mac)
              npx electron-builder --mac --x64 --arm64 \
                -c.mac.identity=null \
                -c.mac.hardenedRuntime=false \
                -c.mac.entitlements=null \
                -c.mac.entitlementsInherit=null \
                -c.mac.gatekeeperAssess=false
              ;;
            *)
              echo "Unknown platform: ${{ matrix.platform }}"
              exit 1
              ;;
          esac

          echo "=== Built files in dist/ ==="
          ls -la dist/ || true

      - name: List built artifacts (debug)
        shell: bash
        run: |
          echo "Artifacts for ${{ matrix.platform }}:"
          ls -la dist/* || true

      - name: Upload artifacts (debug & backup)
        uses: actions/upload-artifact@v4
        with:
          name: 5mind-desktop-${{ matrix.platform }}
          path: dist/*
          retention-days: 7

      - name: Create/Update GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-tag.outputs.tag_name }}
          name: 5Mind Desktop ${{ needs.prepare-tag.outputs.tag_name }}
          body: |
            ### 5Mind Desktop ${{ needs.prepare-tag.outputs.tag_name }}

            Cross-platform release:
            - **Windows** — Installer (.exe)
            - **macOS** — DMG + ZIP (x64 & arm64) – unsigned builds
            - **Linux** — AppImage, DEB, Pacman, RPM

            Auto-generated changelog below.
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
          files: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*.pacman
            dist/*.rpm
